[project]
name = "themis"
version = "0.3.0"
description = "Watches a Linux laptop's system journal for failed logins, brute force, new USB devices and new services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
themis = "themis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["themis"]

[tool.setuptools.package-data]
themis = ["static/*"]
