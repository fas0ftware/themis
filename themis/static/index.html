<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themis</title>
<link rel="icon" href="/static/themis.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header>
  <h1><img src="/static/themis.svg" alt="" width="26" height="26"> Themis <small id="ver"></small></h1>
  <span id="verdict" class="badge">…</span>
</header>
<main>
  <section class="cards" aria-label="Last 24 hours">
    <div class="card"><b id="c-high">–</b><span>high (24 h)</span></div>
    <div class="card"><b id="c-medium">–</b><span>medium (24 h)</span></div>
    <div class="card"><b id="c-low">–</b><span>low (24 h)</span></div>
    <div class="card"><b id="c-known">–</b><span id="c-known-sub">known</span></div>
  </section>
  <section class="grid">
    <div class="panel">
      <h2>Events
        <span class="ctl">
          <select id="days" aria-label="Period"><option value="1">24 h</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="90">90 days</option></select>
          <select id="min" aria-label="Minimum severity"><option value="info">all</option><option value="low" selected>low+</option><option value="medium">medium+</option><option value="high">high+</option></select>
        </span>
      </h2>
      <ol id="events"></ol>
    </div>
    <div class="side">
      <div class="panel"><h2>Listening on the network</h2><ul id="ports" class="plain"></ul></div>
      <div class="panel"><h2>USB devices seen</h2><ul id="usb" class="plain"></ul></div>
      <div class="panel"><h2>Ignore rules</h2><ul id="ignore" class="plain"></ul>
        <p class="muted small">Add one in a terminal: <code>themis ignore add KIND "text"</code></p></div>
    </div>
  </section>
</main>
<footer class="muted">Read-only view of this laptop's journal watch · refreshes every 30 s</footer>
</body>
</html>
